# ── Tuned for t3.micro (1GB RAM, 2 vCPUs) ──
worker_processes 1;
worker_rlimit_nofile 1024;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Reduce memory usage
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    keepalive_requests 100;

    # Smaller buffers to save RAM
    client_body_buffer_size 8k;
    client_header_buffer_size 1k;
    client_max_body_size 1m;
    large_client_header_buffers 2 1k;

    # Disable access log to reduce I/O (enable if debugging)
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Gzip — saves bandwidth, minimal CPU cost
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Cache hashed static assets forever
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Never cache env-config.js — it changes per deployment
        location = /env-config.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Never cache index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check for ALB / monitoring
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
